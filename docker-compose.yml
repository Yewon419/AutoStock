services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: autostock-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autostock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autostock123}
      POSTGRES_DB: ${POSTGRES_DB:-autostock}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autostock"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autostock-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: autostock-backend
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: ./backend
    container_name: autostock-celery-worker
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # 'celery' 큐만 처리 — 분 단위 cron / indicator batch / 매매 사이클 등 짧은 작업
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=4 -Q celery -n default@%h

  celery-stream-worker:
    build: ./backend
    container_name: autostock-celery-stream-worker
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # 'stream' 큐 전용 — KisPriceStream(7시간 long-running)이 conc 1 점유,
    # watchdog_price_stream(분 단위)이 나머지 1 슬롯에서 동작. default 큐 적체와 무관하게 스트림 감시 보장.
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2 -Q stream -n stream@%h

  celery-beat:
    build: ./backend
    container_name: autostock-celery-beat
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A tasks.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    container_name: autostock-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
